[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ball-simulator"
version = "0.1.0"
description = "Synthetic 6-DoF sphere-wall collision trajectories for world-model research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.3",
  "scipy>=1.14",
  "h5py>=3.11",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tqdm>=4.66",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2", 
  "ruff>=0.5", 
  "mypy>=1.10"
]
world-model = [
  "torch>=2.4",
  "torchvision>=0.19",
  "lightning>=2.4",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pandas>=2.2",
  "pyarrow>=17",
  "pillow>=10",
  "tensorboard>=2.17",
]

[project.scripts]
ball_simulator = "ball_simulator.trajectories.cli:app"
ball_renderer = "ball_simulator.rendering.cli:app"
ball_world_model = "ball_world_model.cli:app"
ball_project = "ball_project.cli:app"
create_world_model = "ball_project.cli:create_entrypoint"
run_experiment = "ball_project.cli:run_entrypoint"


[tool.hatch.build.targets.wheel]
packages = [
  "src/ball_simulator",
  "src/ball_world_model",
  "src/ball_project",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
