  weight_decay: 0.05
  configuration_weight: 2.0
  twist_weight: 2.0
  context_twist_weight: 1.0
  interval_twist_variance_weight: 0.1
  orientation_scale_deg: 5.0
  diagnostic_gradient_interval: 100
  latent_prediction_weight: 0.1
  reverse_weight: 0.05
  variance_weight: 0.005
  world_angular_velocity: true
  carrier_weight: 0.05
  tangent_weight: 0.05
  group_weight: 0.05
