# Moving-camera dataset: physics, object trajectories and seed identical to ball_magnus, so
# the static subset repeats ball_magnus trajectories. backend: native as in ball_magnus.
default_environment: free-flight

environments:
  free_flight:
    side_plane:
      surface_id: side_reference
      point: [-2.5, 0.0, 0.0]
      normal: [1.0, 0.0, 0.0]
    rear_plane:
      surface_id: rear_reference
      point: [0.0, 2.5, 0.0]
      normal: [0.0, -1.0, 0.0]
    floor:
      surface_id: floor_reference
      point: [0.0, 0.0, -1.5]
      normal: [0.0, 0.0, 1.0]

# Fixed ball. Per trajectory: initial state, Magnus coefficient and rotational drag.
physics:
  mass: {low: 0.20, high: 0.20}
  radius: {low: 0.10, high: 0.10}
  normal_stiffness: {low: 150000.0, high: 150000.0, scale: log}
  normal_damping: {low: 0.30, high: 0.30}
  tangential_stiffness_ratio: {low: 0.30, high: 0.30}
  tangential_damping_ratio: {low: 0.20, high: 0.20}
  friction: {low: 0.50, high: 0.50}
  drag_coefficient: {low: 0.0, high: 0.0}       # air drag adds < 1 m/s^2 here; left out for clarity
  air_density: 1.225
  magnus_coefficient: {low: 0.0, high: 0.05}    # |a_Magnus| median 3.4, p90 9.9 m/s^2
  rotational_drag: {low: 0.0, high: 0.005}      # spin decays by up to ~70 % over 0.2 s

free_flight_initial_state:
  mode: combined
  x_position: {low: -0.15, high: 0.15}
  y_position: {low: -0.15, high: 0.15}
  z_position: {low: 0.55, high: 0.75}
  x_speed: {low: -1.75, high: 1.75}             # lower than before: trajectories last longer
  y_speed: {low: -1.75, high: 1.75}
  z_speed: {low: -0.75, high: 2.50}             # biased upward: arcs instead of only falling
  spin: {low: -30.0, high: 30.0}
  fixed_position: [0.0, 0.0, 0.65]
  safety_margin: 0.20
  maximum_sampling_attempts: 1000

simulation:
  duration: 0.20                                # 21 frames at 100 fps
  internal_dt: 0.001
  observation_dt: 0.01
  high_rate_dt: null
  gravity: [0.0, 0.0, -9.81]
  penetration_tolerance: 1.0e-12
  backend: native

dataset:
  trajectories: 3000
  seed: 45                                      # new seed: new initial states
  output: trajectories.h5
  compression: gzip
  compression_level: 4
  store_high_rate: false
