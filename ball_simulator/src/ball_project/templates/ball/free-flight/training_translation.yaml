data_config: generated-at-runtime.yaml
model:
  feature_channels: 128
  descriptor_dim: 256
  motion_dim: 128
  temporal_layers: 2
  keypoints: 8
  keypoint_dim: 32
  default_dt: 0.01
  predict_acceleration: true
  standardiser_momentum: 0.01
loss:
  pose: 1.0
  twist: 1.0
  acceleration: 1.0
  rollout: 0.1
  rollout_steps: 5
  orientation_scale_deg: 5.0
optimiser:
  learning_rate: 0.0003
  weight_decay: 0.05
training:
  output_directory: generated-at-runtime
  epochs: 75
  accelerator: auto
  devices: auto
  precision: 32-true
  gradient_clip_norm: 1.0
  deterministic: true
  log_every_n_steps: 10
  num_sanity_val_steps: 2
checkpoint:
  monitor: validation/loss
  mode: min
  save_top_k: 1
  save_last: true
tensorboard:
  name: tensorboard
  version: null