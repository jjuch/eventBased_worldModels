data_config: ball_simulator/src/ball_world_model/configs/data/rotation_in_place.yaml
model:
  task: rotation
  embedding_dim: 256
  temporal_depth: 4
  keypoints: 8
  dropout: 0.0
  learning_rate: 0.0003
  weight_decay: 0.05
  state_weight: 1.0
  translation_consistency_weight: 0.0
  rotation_consistency_weight: 0.1
  # Current simulator stores angular velocity in world coordinates.
  world_angular_velocity: true
training:
  output_directory: outputs/rotation_observer
  epochs: 75
  devices: auto
  precision: bf16-mixed
  gradient_clip_norm: 1.0
  deterministic: true
  log_every_n_steps: 10
