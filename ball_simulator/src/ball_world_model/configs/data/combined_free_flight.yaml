# Change these two paths to your rendered translation+rotation dataset.
root: ball_simulator/rendered/combined_free_flight
manifest_path: ball_simulator/rendered/combined_free_flight/manifest.parquet
require_success_marker: true

image:
  width: 256
  height: 256
  channels: 3
  normalization: imagenet

temporal:
  rendered_fps: 100.0
  frame_stride: 1
  context_frames: 10
  prediction_frames: 1
  target_history_frames: 4

sampling:
  windows_per_trajectory: 10
  random_start: true
  seed: 20260801

splits:
  train_fraction: 0.80
  validation_fraction: 0.10
  test_fraction: 0.10
  seed: 20260801

loader:
  batch_size: 16
  workers: 8
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
