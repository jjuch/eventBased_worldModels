root: ball_simulator/rendered/training
manifest_path: ball_simulator/rendered/training/manifest.parquet
require_succes_marker: true

image:
  width: 128
  height: 128
  channels: 3
  normalization: imagenet

temporal:
  rendered_fps: 100
  frame_stride: 1
  context_frames: 10
  prediction_frames: 10
  target_history_frames: 4

sampling:
  windows_per_trajectory: 1
  random_start: false
  seed: 20260801

splits:
  train_fraction: 0.80
  validation_fraction: 0.10
  test_fraction: 0.10
  seed: 20260801

loader:
  batch_size: 8
  workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true